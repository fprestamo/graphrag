name: musique
description: >
  MuSiQue: Multi-hop Questions via Single-hop Question Composition
  (Trivedi et al., 2022).  Uses the answerable dev split.
dataset:
  source: "https://github.com/StonyBrookNLP/musique"
  local_path: "evaluation/benchmarks/musique/data/musique.jsonl"
  default_file: "musique_ans_v1.0_dev.jsonl"
  max_examples: 500
evaluation:
  metric: "exact_match + token_f1"
  use_llm_judge: true
