name: hotpotqa
description: >
  HotpotQA distractor-setting multi-hop QA (Yang et al., 2018).
dataset:
  url: "http://curtis.ml.cmu.edu/datasets/hotpot/hotpot_dev_distractor_v1.json"
  local_path: "evaluation/benchmarks/hotpotqa/data/hotpotqa.jsonl"
  max_examples: 500
evaluation:
  metric: "exact_match + token_f1"
  use_llm_judge: true
